# Preview for review (ADR 0003): run rig, save one page as one HTML file, deploy it to GitHub
# Pages as a build artifact. The preview is never committed, so a cleaned-up link leaves no
# marked copy in git history.
name: preview

on:
  workflow_dispatch:
    inputs:
      night:
        description: Night to preview (runs/<night>.jsonl)
        default: '2026-10-28'
        required: true
      marker:
        description: Show the lane marker (off for clean-up)
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save the page
        env:
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
          NIGHT: ${{ inputs.night }}
        run: |
          pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8787/health > /dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf "http://localhost:8787/digest/$NIGHT" -o _site/index.html
          if [ -z "$LANE_MARKER" ]; then grep -q 'no marker set' _site/index.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
